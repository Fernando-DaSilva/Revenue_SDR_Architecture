name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valor dummy apenas para CI: app/main.py instancia create_app() no import,
  # e Settings exige SECRET_KEY. Os testes usam suas proprias Settings.
  SECRET_KEY: "ci-dummy-secret-key-with-32-chars-minimum"

jobs:
  quality:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github app/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check app/ tests/ scripts/

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
