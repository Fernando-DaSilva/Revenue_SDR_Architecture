{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-base-200 px-4 py-12 transition-all duration-300">
    <div class="card w-full max-w-md bg-base-100 shadow-2xl border border-base-300/50 overflow-hidden text-center transform transition-all duration-300">
        <div class="card-body p-8 sm:p-10 flex flex-col items-center">
            <!-- Error Icon -->
            <div class="w-16 h-16 p-3 bg-error/10 text-error rounded-2xl flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            
            <h1 class="text-4xl font-extrabold tracking-tight text-error">{{ status_code }}</h1>
            <p class="text-lg font-bold text-base-content mt-2">Ocorreu um erro</p>
            <p class="text-sm text-base-content/60 mt-2 leading-relaxed px-4">{{ message }}</p>

            <div class="divider opacity-30 my-6"></div>

            <a href="/" class="btn btn-outline btn-primary w-full text-sm font-semibold">
                Voltar para o Início
            </a>
        </div>
    </div>
</div>
{% endblock %}
